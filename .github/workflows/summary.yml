name: Weekly Profit Summary

on:
  schedule:
    # Runs automatically every Sunday at 11:59 PM UTC
    - cron: '59 23 * * 0'
  workflow_dispatch: # This allows you to click "Run workflow" manually to test it

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        # THIS IS THE FIX: We are forcing this specific runner to install pandas!
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas
          
      - name: Run Summary
        env:
          # Make sure your secret name here matches what is in your repo settings exactly
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python summary.py