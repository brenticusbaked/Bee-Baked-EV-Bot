name: MLB EV Scanner

on:
  schedule:
    # 10:45 AM CST (16:45 UTC)
    - cron: '45 16 * * *'
    # 4:45 PM CST (22:45 UTC)
    - cron: '45 22 * * *'
    # 6:30 PM CST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run MLB Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot-mlb.py

      - name: Commit and Push Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f bets_log.csv ]; then
            git add bets_log.csv
            git commit -m "Auto-log new MLB +EV bets" || echo "No changes to commit"
            # Pull before pushing to fetch any updates from the other bots
            git pull --rebase origin main
            git push
          else
            echo "No bets logged on this run. Skipping commit."
          fi