name: SharpAPI +EV Alerts

on:
  schedule:
    # SharpAPI can be polled frequently. Check every 15 minutes during the
    # active betting window for new +EV opportunities.
    - cron: '*/15 12-23 * * *'
  workflow_dispatch:

concurrency:
  group: sharp-ev-alerts
  cancel-in-progress: true

jobs:
  sharp-ev-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SharpAPI +EV Alert Scan
        env:
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAILY_SLIPS_WEBHOOK_URL: ${{ secrets.DAILY_SLIPS_WEBHOOK_URL }}
        run: |
          python sharp_ev_alerts.py
