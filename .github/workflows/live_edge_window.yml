name: Live Hammer Watchlist

on:
  schedule:
    # Evening live window: 6 PM-10:45 PM Central during daylight time. Every 15 min
    # — live lines move fast, so this is the highest-value place to spend the extra
    # Actions minutes and catch stale in-game prices quickly.
    - cron: '*/15 23,0,1,2,3 * * *'
  workflow_dispatch:

concurrency:
  group: live-edge-window
  cancel-in-progress: true

jobs:
  live-edge-window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Live Hammer/Watchlist Window
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          DISCORD_LIVE_HAMMER_WEBHOOK_URL: ${{ secrets.DISCORD_LIVE_HAMMER_WEBHOOK_URL }}
          DISCORD_WATCHLIST_WEBHOOK_URL: ${{ secrets.DISCORD_WATCHLIST_WEBHOOK_URL }}
          ODDS_PUSH_WS_URL: ${{ secrets.ODDS_PUSH_WS_URL }}
          ODDS_PUSH_API_KEY: ${{ secrets.ODDS_PUSH_API_KEY }}
          ODDS_PUSH_PROVIDER: ${{ secrets.ODDS_PUSH_PROVIDER }}
          ODDS_PUSH_AUTH_MODE: ${{ secrets.ODDS_PUSH_AUTH_MODE }}
          ODDS_PUSH_AUTH_HEADER: ${{ secrets.ODDS_PUSH_AUTH_HEADER }}
          ODDS_PUSH_API_KEY_PARAM: ${{ secrets.ODDS_PUSH_API_KEY_PARAM }}
          ODDS_PUSH_SPORT: ${{ secrets.ODDS_PUSH_SPORT }}
          ODDS_PUSH_SUBSCRIBE_JSON: ${{ secrets.ODDS_PUSH_SUBSCRIBE_JSON }}
          LIVE_HAMMER_EDGE_THRESHOLD: ${{ vars.LIVE_HAMMER_EDGE_THRESHOLD }}
          WATCHLIST_EDGE_THRESHOLD: ${{ vars.WATCHLIST_EDGE_THRESHOLD }}
          LIVE_STALE_MIN_SCORE: ${{ vars.LIVE_STALE_MIN_SCORE }}
          LIVE_SHARP_BOOKS: ${{ vars.LIVE_SHARP_BOOKS }}
          LIVE_SOFT_BOOKS: ${{ vars.LIVE_SOFT_BOOKS }}
          LIVE_EDGE_STATUS_NOTIFY: "true"
          PREGAME_STATUS_NOTIFY: "true"
          PREGAME_REFRESH_ODDS: "false"
          ENABLE_ODDS_SECONDARY_PULL: "false"
          ENABLE_ODDS_TERTIARY_PULL: "false"
          ENABLE_ODDS_PARTIAL_MARKET_PULL: "false"
        run: |
          if [ -n "${ODDS_PUSH_WS_URL}" ]; then
            set +e
            timeout 840 python odds_push_feed.py
            code=$?
            set -e
            if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
              echo "Live push feed failed with $code; running polling fallback."
              python live_edge_poll.py
            fi
          else
            python live_edge_poll.py
          fi
          python pregame_scan.py
