name: Closing Line Value Tracker

on:
  schedule:
    # 6:00 PM CST (00:00 UTC next day) and 9:00 PM CST (03:00 UTC)
    - cron: '0 0,3 * * *'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run CLV Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python clv-tracker.py
      - name: Commit and Push Updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f bets_log.csv ]; then
            git add bets_log.csv
            git commit -m "Auto-update Closing Line Value" || echo "No changes"
            git pull --rebase origin main
            git push
          fi