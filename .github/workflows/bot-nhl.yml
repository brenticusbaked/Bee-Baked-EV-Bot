name: NHL EV Scanner

on:
  schedule:
    # 10:40 AM CST (16:40 UTC)
    - cron: '40 16 * * *'
    # 4:40 PM CST (22:40 UTC)
    - cron: '40 22 * * *'
    # 6:25 PM CST (00:25 UTC)
    - cron: '25 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run NHL Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot-nhl.py

      - name: Commit and Push Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f bets_log.csv ]; then
            git add bets_log.csv
            git commit -m "Auto-log new NHL +EV bets" || echo "No changes to commit"
            # Crucial pull step: fetches any updates the NBA/NCAAB bots made in the last 10 mins
            git pull --rebase origin main
            git push
          else
            echo "No bets logged on this run. Skipping commit."
          fi