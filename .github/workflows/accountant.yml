name: Weekly Results & Accountant
on:
  schedule:
    - cron: '0 15 * * 1' # Monday 9:00 AM CST
  workflow_dispatch: 
permissions:
  contents: write  
jobs:
  grade-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
        run: python sgo-grader.py
      - name: Safe Commit Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f bets_log.csv ]; then
            git add bets_log.csv
            git commit -m "Grade results" || echo "No changes"
            git pull --rebase origin main
            git push
          fi