name: Weekly Performance Accountant
on:
  schedule:
    - cron: '0 14 * * 1' # Monday Mornings
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grade_and_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
        run: |
          python sgo-grader.py
      - run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bets_log.csv
          git commit -m "Weekly bet grading complete" || echo "No changes"
          git push