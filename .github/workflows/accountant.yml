name: Weekly Accountant Report

on:
  schedule:
    # Runs at 14:00 UTC every Monday (10:00 AM EST)
    # The '1' at the end specifies Monday (0 is Sunday, 1 is Monday, etc.)
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allows you to manually trigger a report anytime

jobs:
  run-accountant:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run Accountant
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python accountant.py