name: ParlayAPI +EV Props

on:
  schedule:
    # Scan ParlayAPI for +EV opportunities every 30 minutes during the active
    # betting window. Adjust frequency to fit your monthly credit budget.
    - cron: '*/30 14-23 * * *'
  workflow_dispatch:

concurrency:
  group: parlay-props
  cancel-in-progress: true

jobs:
  parlay-props:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ParlayAPI +EV Prop Scan
        env:
          PARLAYAPI_KEY: ${{ secrets.PARLAYAPI_KEY }}
          PARLAYAPI_KEY_2: ${{ secrets.PARLAYAPI_KEY_2 }}
          PARLAYAPI_KEY_3: ${{ secrets.PARLAYAPI_KEY_3 }}
          PARLAYAPI_SPORTS: ${{ vars.PARLAYAPI_SPORTS || 'baseball_mlb' }}
          PARLAYAPI_MARKETS: ${{ vars.PARLAYAPI_MARKETS || '' }}
          PARLAY_EV_THRESHOLD: ${{ vars.PARLAY_EV_THRESHOLD || '0.0' }}
          PARLAY_EDGE_THRESHOLD: ${{ vars.PARLAY_EDGE_THRESHOLD || '0.0' }}
          PARLAY_MAX_ALERTS: ${{ vars.PARLAY_MAX_ALERTS || '5' }}
          PARLAY_MAX_UNITS: ${{ vars.PARLAY_MAX_UNITS || '5.0' }}
          PARLAY_LIMIT: ${{ vars.PARLAY_LIMIT || '50' }}
          PARLAY_REQUEST_DELAY: ${{ vars.PARLAY_REQUEST_DELAY || '1.0' }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        run: |
          python bot_parlay_props.py
