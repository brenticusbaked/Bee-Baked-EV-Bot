name: Bee-Baked-EV-Bot Sync

on:
  schedule:
    # 10:30 AM CST (Morning Props Open)
    - cron: '30 16 * * *'
    # 4:30 PM CST (Injury News Window)
    - cron: '30 22 * * *'
    # 6:15 PM CST (Pre-Tip Closing Line)
    - cron: '15 0 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot.py