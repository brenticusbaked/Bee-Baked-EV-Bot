name: Bee-Baked-EV-Bot Sync

on:
  schedule:
    # 10:30 AM CST (16:30 UTC) - The Morning Prop Open
    - cron: '30 16 * * *'
    
    # 4:30 PM CST (22:30 UTC) - The Afternoon Injury Scramble
    - cron: '30 22 * * *'
    
    # 6:15 PM CST (00:15 UTC) - The Pre-Tip Closing Lines
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Betting Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot.py