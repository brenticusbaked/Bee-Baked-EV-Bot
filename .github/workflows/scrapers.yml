name: Syndicate Scrapers

on:
  schedule:
    # Runs at 08:30 and 16:30 UTC — 30 minutes after the core pipeline (main.yml at 08:00/16:00)
    # This ensures the core odds cache is populated before scrapers fire.
    - cron: '30 8,16 * * *'
  workflow_dispatch:

jobs:
  scrape-books:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # Pin to v1.x stable — v2.x does not exist on PyPI.
          # The scraper_unified.py uses stealth_sync(page) from this version.
          pip install playwright-stealth==1.0.6
          playwright install chromium

      - name: Run Unified Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPER_PROXY_ATTEMPTS: "2"
          ENABLE_PYBASEBALL_FIP_SCRAPER: "false"
          ENABLE_DRAFTKINGS_SCRAPER: "false"
          ENABLE_BETMGM_SCRAPER: "false"
          ENABLE_FANDUEL_SCRAPER: "true"
          ENABLE_PRIZEPICKS_SCRAPER: "false"
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: python scraper_unified.py
