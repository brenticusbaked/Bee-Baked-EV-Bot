name: Bet Lifecycle And CLV

on:
  schedule:
    # Tracks open bets and CLV movement across the active betting day. Every 3h
    # (down from hourly) to conserve Actions minutes — settlement/CLV doesn't need
    # minute-level freshness.
    - cron: '5 14,17,20,23,2 * * *'
  workflow_dispatch:

concurrency:
  group: bet-lifecycle
  cancel-in-progress: true

jobs:
  bet-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bet Lifecycle And CLV Updates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          DISCORD_DAILY_SLIPS_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_SLIPS_WEBHOOK_URL }}
          BET_LIFECYCLE_PLAYABLE_EDGE: "0.005"
          BET_LIFECYCLE_MOVEMENT_NOTIFY_PCT: "1.0"
          BET_LIFECYCLE_NOTIFY_INITIAL: "false"
          CLV_SEND_DISCORD_UPDATES: "true"
          CLV_NOTIFY_MIN_CHANGE_PCT: "0.75"
          CLV_MAX_ALERTS: "10"
        run: |
          python bet_lifecycle_monitor.py
          python clv_tracker.py
