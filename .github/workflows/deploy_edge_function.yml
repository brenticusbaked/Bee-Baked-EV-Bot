name: Deploy Edge Function

# Deploys the odds-cache-ingest Supabase Edge Function.
# Runs on manual dispatch, and automatically when the function source changes on
# main. Requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN  - a personal access token (Supabase → Account → Tokens)
#   SUPABASE_PROJECT_REF   - the project ref (Project Settings → General → Reference ID)
# Function secrets (ODDS_API_KEY*, SUPABASE_SERVICE_ROLE_KEY, ODDS_INGEST_FUNCTION_SECRET,
# book/region vars) are set separately via `supabase secrets set` and are NOT managed here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

concurrency:
  group: deploy-edge-function
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy odds-cache-ingest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets must be set."
            exit 1
          fi
          supabase functions deploy odds-cache-ingest --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
