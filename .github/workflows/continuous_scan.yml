name: Continuous +EV Scan

# Continuous +EV alerting. Reads the Supabase market cache (populated every 10
# minutes by the odds-cache-ingest Edge Function) and runs the full unified
# scan. Makes NO Odds API requests, so it spends no credits — only GitHub
# Actions minutes. Cadence is aligned to the Supabase ingestion cadence so every
# fresh cache cycle gets scanned promptly (no paid odds data goes un-scanned):
#   prime   16:00-04:59 UTC -> every 20 min (matches prime ingestion)
#   morning 11:00-15:59 UTC -> every 30 min (matches morning ingestion)
# Duplicate alerts are suppressed by dedupe. Paused overnight (05:00-10:59 UTC =
# ~12am-6am Central) since no bets are placed then, matching the ingestion blackout.
on:
  schedule:
    - cron: '*/20 16-23,0-4 * * *'
    - cron: '*/30 11-15 * * *'
  workflow_dispatch:

concurrency:
  group: continuous-scan
  cancel-in-progress: true

jobs:
  continuous-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Continuous +EV Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_NBA_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_NBA_BETS_WEBHOOK_URL }}
          DISCORD_WNBA_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_WNBA_BETS_WEBHOOK_URL }}
          DISCORD_MLB_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_MLB_BETS_WEBHOOK_URL }}
          DISCORD_NHL_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_NHL_BETS_WEBHOOK_URL }}
          ENABLE_UNIFIED_SCAN: "true"
          ENABLE_PLAYER_PROP_ALERTS: "true"
          ENABLE_ALTERNATE_MARKET_ALERTS: "true"
          ENABLE_PARTIAL_GAME_MARKET_ALERTS: "true"
          ENABLE_MLB_H2H_ALERTS: "true"
          UNIFIED_EV_THRESHOLD: "0.008"
          UNIFIED_SPREAD_EV_THRESHOLD: "0.008"
          UNIFIED_H2H_EV_THRESHOLD: "0.012"
          UNIFIED_TOTAL_EV_THRESHOLD: "0.010"
          UNIFIED_ALT_MARKET_EV_THRESHOLD: "0.020"
          UNIFIED_PARTIAL_MARKET_EV_THRESHOLD: "0.020"
          UNIFIED_MAX_ALERTS_PER_EVENT_MARKET: "5"
        run: python continuous_scan.py
