name: Odds Edge Alert

on:
  schedule:
    # Runs 20 minutes after the core pipeline windows.
    - cron: '20 14,20 * * *'
  workflow_dispatch:

jobs:
  odds-edge-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Odds Edge Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python odds_edge_alert.py --supabase --logs ./logs --threshold 0.03 --min-sample 20 --always-notify --allow-missing-logs --json
