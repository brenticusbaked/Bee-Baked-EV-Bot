name: Injury News Scraper

on:
  schedule:
    # Runs at minute 0 of every hour (e.g., 12:00, 1:00, 2:00)
    - cron: '0 * * * *'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper-bot.py

      - name: Commit and Push Seen News
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f seen_news.txt ]; then
            git add seen_news.txt
            git commit -m "Update seen injury news log" || echo "No new news to commit"
            git pull --rebase origin main
            git push
          else
            echo "No news file created. Skipping commit."
          fi