name: DraftKings Line Tracker

on:
  schedule:
    # Runs at minute 0 and 30 past every hour
    - cron: '0,30 * * * *'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run DraftKings Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scraper-draftkings.py
        
      - name: Commit and Push DK Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f dk_lines.json ]; then
            git add dk_lines.json
            git commit -m "Update DraftKings line tracking" || echo "No changes"
            git pull --rebase origin main
            git push
          fi