name: Live Push Smoke Test

on:
  workflow_dispatch:
    inputs:
      max_messages:
        description: "Stop after this many WebSocket messages"
        required: false
        default: "3"
      timeout_seconds:
        description: "Kill the smoke test after this many seconds"
        required: false
        default: "90"

jobs:
  live-push-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Live Push Smoke Test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_LIVE_HAMMER_WEBHOOK_URL: ${{ secrets.DISCORD_LIVE_HAMMER_WEBHOOK_URL }}
          DISCORD_WATCHLIST_WEBHOOK_URL: ${{ secrets.DISCORD_WATCHLIST_WEBHOOK_URL }}
          ODDS_PUSH_WS_URL: ${{ secrets.ODDS_PUSH_WS_URL }}
          ODDS_PUSH_API_KEY: ${{ secrets.ODDS_PUSH_API_KEY }}
          ODDS_PUSH_PROVIDER: ${{ secrets.ODDS_PUSH_PROVIDER }}
          ODDS_PUSH_AUTH_MODE: ${{ secrets.ODDS_PUSH_AUTH_MODE || 'query' }}
          ODDS_PUSH_AUTH_HEADER: ${{ secrets.ODDS_PUSH_AUTH_HEADER }}
          ODDS_PUSH_API_KEY_PARAM: ${{ secrets.ODDS_PUSH_API_KEY_PARAM }}
          ODDS_PUSH_SPORT: ${{ secrets.ODDS_PUSH_SPORT }}
          ODDS_PUSH_SUBSCRIBE_JSON: ${{ secrets.ODDS_PUSH_SUBSCRIBE_JSON }}
          ODDS_PUSH_MAX_MESSAGES: ${{ inputs.max_messages }}
          LIVE_HAMMER_EDGE_THRESHOLD: ${{ vars.LIVE_HAMMER_EDGE_THRESHOLD }}
          WATCHLIST_EDGE_THRESHOLD: ${{ vars.WATCHLIST_EDGE_THRESHOLD }}
          LIVE_STALE_MIN_SCORE: ${{ vars.LIVE_STALE_MIN_SCORE }}
          LIVE_SHARP_BOOKS: ${{ vars.LIVE_SHARP_BOOKS }}
          LIVE_SOFT_BOOKS: ${{ vars.LIVE_SOFT_BOOKS }}
        run: timeout "${{ inputs.timeout_seconds }}" python odds_push_feed.py
