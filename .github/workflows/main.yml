name: Bee-Baked-EV-Bot Pipeline

on:
  schedule:
    # 11:30/18:30 UTC = 6:30 AM/1:30 PM Central during daylight time.
    # Scheduled off the top of the hour because GitHub Actions queues :00 crons
    # heaviest, which was delaying morning results toward noon.
    # Two runs/day keeps all 3 Odds API keys within the 500 credit/month free tier.
    - cron: '30 11,18 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Only install browsers when cache misses
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi

      - name: Run Master Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_INJURY_WEBHOOK_URL: ${{ secrets.DISCORD_INJURY_WEBHOOK_URL }}
          DISCORD_MLB_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_MLB_UPDATES_WEBHOOK_URL }}
          DISCORD_NHL_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_NHL_UPDATES_WEBHOOK_URL }}
          DISCORD_NFL_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_NFL_UPDATES_WEBHOOK_URL }}
          DISCORD_WNBA_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_WNBA_UPDATES_WEBHOOK_URL }}
          DISCORD_SOCCER_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_SOCCER_UPDATES_WEBHOOK_URL }}
          DISCORD_WNBA_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_WNBA_BETS_WEBHOOK_URL }}
          ENABLE_NEWS: "true"
          ENABLE_NBA_PROP_BOT: "true"
          ENABLE_NBA_MODEL: "true"
          ENABLE_NHL_MODEL: "true"
          ENABLE_MLB_MODEL: "true"
          ENABLE_UNIFIED_SCAN: "true"
          ENABLE_CLV_TRACKER: "true"
          ENABLE_SGO_GRADER: "false"
          ENABLE_EXECUTION_DESK: "true"
          ENABLE_ODDS_SECONDARY_PULL: "true"
          ENABLE_ODDS_TERTIARY_PULL: "true"
          EXECUTION_EV_THRESHOLD: "0.025"
          EXECUTION_CALIBRATION_ORDERS: "0"
          ENABLE_ODDSHARVESTER: "true"
          ENABLE_PERFORMANCE_REPORT: "true"
          ENABLE_MONTE_CARLO: "true"
          ENABLE_BETMGM_SCRAPER: "true"
          ENABLE_ADAPTIVE_VENUE_SCORING: "true"
          EXECUTION_VENUE_SCORE_LOOKBACK: "500"
          EXECUTION_VENUE_SCORE_MIN_SAMPLE: "3"
          EXECUTION_MAX_ORDERS: "10"
          EXECUTION_MAX_ORDER_UNITS: "5"
          EXECUTION_MAX_NOTIONAL: "1000"
          
          # --- PROXY AUTHENTICATION ---
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          
          # --- FANGRAPHS / REQUESTS BYPASS ---
          # We use quotes and strict formatting to prevent DNS resolution errors
          HTTP_PROXY: "http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@p.webshare.io:80"
          HTTPS_PROXY: "http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@p.webshare.io:80"
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        run: |
          python master_run.py
