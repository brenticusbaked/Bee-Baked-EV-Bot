name: Bee-Baked-EV-Bot Pipeline

on:
  schedule:
    # Run every 2 hours during peak betting windows to conserve credits
    - cron: '0 12,14,16,18,20,22 * * *'
    - cron: '0 0,2 * * *'
  workflow_dispatch:
    inputs:
      scratch_guard_trace:
        description: "Print scratch_guard skip details for one run"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: main-pipeline
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi

      - name: Run Master Pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
          PARLAYAPI_KEY: ${{ secrets.PARLAYAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_INGEST_FUNCTION_SECRET: ${{ secrets.ODDS_INGEST_FUNCTION_SECRET }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_ARBITRAGE_WEBHOOK_URL: ${{ secrets.DISCORD_ARBITRAGE_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          DISCORD_INJURY_WEBHOOK_URL: ${{ secrets.DISCORD_INJURY_WEBHOOK_URL }}
          DISCORD_DAILY_SLIPS_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_SLIPS_WEBHOOK_URL }}
          DISCORD_MLB_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_MLB_UPDATES_WEBHOOK_URL }}
          DISCORD_NHL_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_NHL_UPDATES_WEBHOOK_URL }}
          DISCORD_NFL_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_NFL_UPDATES_WEBHOOK_URL }}
          DISCORD_WNBA_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_WNBA_UPDATES_WEBHOOK_URL }}
          DISCORD_SOCCER_UPDATES_WEBHOOK_URL: ${{ secrets.DISCORD_SOCCER_UPDATES_WEBHOOK_URL }}
          DISCORD_WNBA_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_WNBA_BETS_WEBHOOK_URL }}
          DISCORD_TENNIS_BETS_WEBHOOK_URL: ${{ secrets.DISCORD_TENNIS_BETS_WEBHOOK_URL }}
          DISCORD_LIVE_HAMMER_WEBHOOK_URL: ${{ secrets.DISCORD_LIVE_HAMMER_WEBHOOK_URL }}
          DISCORD_WATCHLIST_WEBHOOK_URL: ${{ secrets.DISCORD_WATCHLIST_WEBHOOK_URL }}
          ENABLE_NEWS: "true"
          ENABLE_NBA_PROP_BOT: "true"
          ENABLE_NBA_MODEL: "true"
          ENABLE_NHL_MODEL: "true"
          ENABLE_MLB_MODEL: "true"
          ENABLE_WNBA_MODEL: "true"
          ENABLE_NRFI_MODEL: "true"
          ENABLE_UNIFIED_SCAN: "true"
          ENABLE_ARBITRAGE_SCAN: "true"
          ENABLE_CLV_TRACKER: "true"
          ENABLE_SGO_GRADER: "true"
          ENABLE_EXECUTION_DESK: "true"
          ENABLE_ODDS_SECONDARY_PULL: "true"
          ENABLE_ODDS_TERTIARY_PULL: "true"
          ENABLE_ODDS_PARTIAL_MARKET_PULL: "false"
          ENABLE_MLB_F5_PULL: "true"
          ENABLE_ALTERNATE_MARKET_ALERTS: "true"
          ENABLE_PARTIAL_GAME_MARKET_ALERTS: "true"
          SCRATCH_GUARD_START_GRACE_MINUTES: "180"
          SCRATCH_GUARD_SCHEDULE_GRACE_MINUTES: "360"
          SCRATCH_GUARD_TRACE: ${{ inputs.scratch_guard_trace || 'false' }}
          ENABLE_MLB_H2H_ALERTS: "true"
          ENABLE_CORRELATION_LIMITS: "false"
          UNIFIED_EV_THRESHOLD: "0.008"
          UNIFIED_SPREAD_EV_THRESHOLD: "0.008"
          UNIFIED_H2H_EV_THRESHOLD: "0.012"
          UNIFIED_TOTAL_EV_THRESHOLD: "0.010"
          UNIFIED_ALT_MARKET_EV_THRESHOLD: "0.015"
          UNIFIED_PARTIAL_MARKET_EV_THRESHOLD: "0.015"
          UNIFIED_MAX_ALERTS_PER_EVENT_MARKET: "5"
          UNIFIED_PROP_KELLY_FRACTION: "0.25"
          MC_LOOKBACK_DAYS: "3650"
          EXECUTION_EV_THRESHOLD: "0.015"
          EXECUTION_CALIBRATION_ORDERS: "0"
          ENABLE_ODDSHARVESTER: "true"
          ENABLE_PERFORMANCE_REPORT: "true"
          ENABLE_MONTE_CARLO: "true"
          ENABLE_BETMGM_SCRAPER: "true"
          ENABLE_ADAPTIVE_VENUE_SCORING: "true"
          EXECUTION_VENUE_SCORE_LOOKBACK: "500"
          EXECUTION_VENUE_SCORE_MIN_SAMPLE: "3"
          EXECUTION_MAX_ORDERS: "10"
          EXECUTION_MAX_ORDER_UNITS: "0"
          EXECUTION_MAX_NOTIONAL: "0"
          EXECUTION_MAX_SYMBOL_EXPOSURE: "0"
          PROP_SHARP_BOOKS: "pinnacle,bookmaker,circa,cris,betonline,fanduel,draftkings"
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          USER_AGENT: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        run: |
          python master_run.py
          python wnba_model.py
          python model_nrfi.py
          python scraper_mlb_statcast_hr.py
          python daily_slips_report.py