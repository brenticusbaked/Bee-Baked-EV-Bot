name: Bee-Baked Master Run

on:
  schedule:
    # Runs twice a day at 8:00 AM UTC and 4:00 PM UTC
    - cron: '0 8,16 * * *'
  workflow_dispatch: 
    # Allows you to manually trigger a run anytime from the GitHub Actions tab

jobs:
  run-syndicate-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Recommended stable version
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium
          # Installs the headless browser required for your soft-book scrapers

      - name: Execute Master Run
        env:
          # Pulls your secure keys directly from GitHub Repository Secrets
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python master_run.py