name: Bee-Baked-EV-Bot Pipeline

on:
  schedule:
    # Runs exactly twice a day: 8:00 AM and 4:00 PM UTC
    - cron: '0 8,16 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Master Pipeline
        env:
          # Core DB and Odds connections
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
          # Prop model key
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          
          # Discord Routing
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # Main Alerts
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }} # Moderator/Summary Routing

          # Proxy Override to bypass FanGraphs 403 block for pybaseball
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
        run: |
          python master_run.py
