name: SGO Daily Auto-Grader

on:
  schedule:
    # Runs at 13:00 UTC every day (Which is 9:00 AM Eastern Time)
    - cron: '0 13 * * *'
  workflow_dispatch: # Gives you a manual 'Run' button just in case

permissions:
  contents: write

jobs:
  run-grader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run SGO Grader
        env:
          SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python sgo-grader.py

      - name: Commit and Push Graded Bets
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bets_log.csv
          # Checks for changes (new W/L grades) and pushes them to your repo
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Auto-graded yesterday's bets" && git push)