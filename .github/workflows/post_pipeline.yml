name: Post-Pipeline Scrapers & Edge Alerts

on:
  # Scheduled runs are DISABLED to conserve GitHub Actions minutes. The Playwright
  # bookie scrapers (DraftKings/BetMGM/FanDuel/oddsharvester) no longer work — the
  # sites' DOM changed and every selector times out, so each run ground on until
  # the 30-min job timeout and was cancelled with zero data (~10,800 min/month
  # wasted). Odds now come from Supabase-first ingestion (odds-cache-ingest Edge
  # Function). The workflow + manual trigger are kept so the scrapers can be
  # repaired and re-enabled later by uncommenting the schedule below.
  #
  # The book requests now egress through ScraperAPI rather than the runner's own
  # IP, so re-enabling the schedule is worth a manual dispatch first: check the
  # per-book success rates in the [scraperapi] summary before paying for a cron.
  # schedule:
  #   - cron: '30 14,20 * * *'
  #   - cron: '15,45 23,0,1,2,3 * * *'
  workflow_dispatch:

concurrency:
  group: post-pipeline
  cancel-in-progress: true

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # Pin to v1.x stable; v2.x does not exist on PyPI.
          # scraper_unified.py uses stealth_sync(page) from this version.
          pip install playwright-stealth==1.0.6
          playwright install chromium

      - name: Run Unified Scraper
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DISCORD_DEAD_LETTER_WEBHOOK_URL: ${{ secrets.DISCORD_DEAD_LETTER_WEBHOOK_URL }}
          # Books whose odds only exist after the page's JavaScript runs. Each
          # listed book costs 25 credits per request instead of 10.
          SCRAPERAPI_RENDER_BOOKS: ""
          SCRAPERAPI_MAX_CREDITS_PER_RUN: "600"
          SCRAPERAPI_RUN_BUDGET_SECONDS: "600"
          SCRAPER_PROXY_ATTEMPTS: "2"
          ENABLE_PYBASEBALL_FIP_SCRAPER: "true"
          ENABLE_DRAFTKINGS_SCRAPER: "true"
          ENABLE_BETMGM_SCRAPER: "true"
          ENABLE_FANDUEL_SCRAPER: "true"
          ENABLE_ODDSHARVESTER: "true"
          BETMGM_ENABLE_BROWSER_FALLBACK: "true"
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: python -u scraper_unified.py

      - name: Run Odds Edge Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python odds_edge_alert.py --supabase --logs ./logs --threshold 0.03 --min-sample 20 --always-notify --allow-missing-logs --json
