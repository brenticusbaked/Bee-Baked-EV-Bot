name: Post-Pipeline Scrapers & Edge Alerts

on:
  # Scheduled again now that the books egress through ScraperAPI instead of the
  # runner's own (blocked) IP: a manual dispatch returned Underdog, FanDuel and
  # DraftKings payloads, where the old Playwright-on-the-runner path returned
  # nothing and ground on to the 30-minute timeout.
  #
  # Four runs a day, 30 minutes after each main.yml window (13/15/18/20 UTC) so
  # the master cache is already refreshed. At ~300 ScraperAPI credits a run that
  # is ~36k of the 100k monthly plan, leaving headroom for manual dispatches;
  # SCRAPERAPI_MONTHLY_CREDITS is the hard stop either way.
  schedule:
    - cron: '30 13,15,18,20 * * *'
  workflow_dispatch:

concurrency:
  group: post-pipeline
  cancel-in-progress: true

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # Pin to v1.x stable; v2.x does not exist on PyPI.
          # scraper_unified.py uses stealth_sync(page) from this version.
          pip install playwright-stealth==1.0.6
          playwright install chromium

      - name: Run Unified Scraper
        env:
          PYTHONUNBUFFERED: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DISCORD_DEAD_LETTER_WEBHOOK_URL: ${{ secrets.DISCORD_DEAD_LETTER_WEBHOOK_URL }}
          # Books whose odds only exist after the page's JavaScript runs. Each
          # listed book costs 25 credits per request instead of 10.
          SCRAPERAPI_RENDER_BOOKS: ""
          # 100,000/month plan. At ~2,500 per run the plan funds ~40 runs a
          # month, so the monthly ceiling is what actually protects the balance
          # once this workflow goes on a cron.
          SCRAPERAPI_MAX_CREDITS_PER_RUN: "2500"
          SCRAPERAPI_MONTHLY_CREDITS: "100000"
          SCRAPERAPI_RUN_BUDGET_SECONDS: "600"
          # PrizePicks 429'd on 5 parallel league requests, so both the per-call
          # and the process-wide ceilings stay under the plan's thread limit.
          SCRAPERAPI_CONCURRENCY: "2"
          SCRAPERAPI_MAX_IN_FLIGHT: "4"
          SCRAPER_PROXY_ATTEMPTS: "2"
          ENABLE_PYBASEBALL_FIP_SCRAPER: "true"
          ENABLE_DRAFTKINGS_SCRAPER: "true"
          # DraftKings' Playwright fallbacks time out from runner IPs and cost
          # minutes of job time; the ScraperAPI JSON endpoint is the live path.
          DRAFTKINGS_BROWSER_FALLBACK: "false"
          ENABLE_BETMGM_SCRAPER: "true"
          ENABLE_FANDUEL_SCRAPER: "true"
          ENABLE_ODDSHARVESTER: "true"
          ENABLE_UNDERDOG_SCRAPER: "true"
          ENABLE_PRIZEPICKS_SCRAPER: "true"
          # PrizePicks publishes no per-leg price. Leave this unset and the board
          # is logged for line-shopping only; set it to the decimal price your
          # account actually pays per leg to price it for EV.
          PRIZEPICKS_LEG_DECIMAL_PRICE: ""
          ENABLE_PROPHETX_INGEST: "true"
          PROPHETX_API_KEY: ${{ secrets.PROPHETX_API_KEY }}
          PROPHETX_ACCESS_KEY: ${{ secrets.PROPHETX_ACCESS_KEY }}
          PROPHETX_SECRET_KEY: ${{ secrets.PROPHETX_SECRET_KEY }}
          BETMGM_ENABLE_BROWSER_FALLBACK: "true"
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: python -u scraper_unified.py

      - name: Run Odds Edge Alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python odds_edge_alert.py --supabase --logs ./logs --threshold 0.03 --min-sample 20 --always-notify --allow-missing-logs --json
