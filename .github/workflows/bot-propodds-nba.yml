name: Prop-Odds NBA Scanner

on:
  schedule:
    # 1:00 PM CST (19:00 UTC)
    - cron: '0 19 * * *'
    # 3:00 PM CST (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run Prop-Odds Bot
        - name: Run NBA Props Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SPORTS_GAME_ODDS_API_KEY: ${{ secrets.SPORTS_GAME_ODDS_API_KEY }}
        run: python bot-propodds-nba.py
        
      - name: Commit and Push Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f bets_log.csv ]; then
            git add bets_log.csv
            git commit -m "Auto-log new NBA Prop bets" || echo "No changes"
            git pull --rebase origin main
            git push
          fi