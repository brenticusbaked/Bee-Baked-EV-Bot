name: Unified EV Scanner
on:
  schedule:
    - cron: '0 14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          # Explicitly fix the Ubuntu 24.04 Noble audio library issue
          sudo apt-get update
          sudo apt-get install -y libasound2t64
          # Now install browsers and remaining dependencies
          playwright install chromium --with-deps

      - name: Run Scanners
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Ensure your unified-bot.py has the --mode flag!
          python unified-bot.py --mode main
          python unified-bot.py --mode props
          python scraper-bovada.py
          python scraper-kambi.py
          python parser-scrapers.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bets_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update" && git push)