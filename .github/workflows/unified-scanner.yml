- name: Run Unified Scanner & Competitive Props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1. Scan Main Markets (H2H, Spreads, Totals)
          python unified-bot.py --mode main
          
          # 2. Scan Smart-Filtered Player Props
          # This only calls games where spread <= 3.0
          python unified-bot.py --mode props