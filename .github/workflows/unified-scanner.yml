name: Unified EV Scanner

on:
  schedule:
    - cron: '0 14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    # This is the magic fix. 22.04 has the libraries Playwright needs.
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          # Standard install command works perfectly on 22.04
          playwright install chromium --with-deps

      - name: Run Scanners
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python unified-bot.py --mode main
          python unified-bot.py --mode props
          python scraper-bovada.py
          python scraper-kambi.py
          python parser-scrapers.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bets_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update bets_log.csv" && git push)