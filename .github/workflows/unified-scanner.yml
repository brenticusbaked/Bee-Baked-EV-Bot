name: Unified EV Scanner
on:
  schedule:
    - cron: '*/30 * * * *'  # Standard 30-minute scan for daily sports
    - cron: '0 18-23 * * 6' # MMA Peak: Every hour from 6 PM to 11 PM UTC on Saturdays
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Run standard sports
      - name: Run Daily Sports
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python unified-bot.py --mode main --sport all

      # Add MMA specifically for Saturdays or if sport is available
      - name: Run MMA Scanner
        if: github.event.schedule == '0 18-23 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python unified-bot.py --mode main --sport mma

      - name: Commit Logs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add bets_log.csv
          git commit -m "Update bets log [skip ci]" || echo "No changes to commit"
          git push