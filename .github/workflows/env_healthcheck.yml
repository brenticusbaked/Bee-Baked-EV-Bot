name: Environment Healthcheck

on:
  workflow_dispatch:
    inputs:
      check_live:
        description: "Require live WebSocket push feed variables"
        required: false
        default: true
        type: boolean
      show_optional:
        description: "Show optional variable status"
        required: false
        default: true
        type: boolean

jobs:
  env-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Environment
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_ARBITRAGE_WEBHOOK_URL: ${{ secrets.DISCORD_ARBITRAGE_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_RESULTS_WEBHOOK_URL: ${{ secrets.DISCORD_RESULTS_WEBHOOK_URL }}
          DISCORD_INJURY_WEBHOOK_URL: ${{ secrets.DISCORD_INJURY_WEBHOOK_URL }}
          DISCORD_LIVE_HAMMER_WEBHOOK_URL: ${{ secrets.DISCORD_LIVE_HAMMER_WEBHOOK_URL }}
          DISCORD_WATCHLIST_WEBHOOK_URL: ${{ secrets.DISCORD_WATCHLIST_WEBHOOK_URL }}
          ODDS_PUSH_WS_URL: ${{ secrets.ODDS_PUSH_WS_URL }}
          ODDS_PUSH_API_KEY: ${{ secrets.ODDS_PUSH_API_KEY }}
          ODDS_PUSH_PROVIDER: ${{ secrets.ODDS_PUSH_PROVIDER }}
          ODDS_PUSH_AUTH_MODE: ${{ secrets.ODDS_PUSH_AUTH_MODE }}
          ODDS_PUSH_AUTH_HEADER: ${{ secrets.ODDS_PUSH_AUTH_HEADER }}
          ODDS_PUSH_API_KEY_PARAM: ${{ secrets.ODDS_PUSH_API_KEY_PARAM }}
          ODDS_PUSH_SPORT: ${{ secrets.ODDS_PUSH_SPORT }}
          ODDS_PUSH_SUBSCRIBE_JSON: ${{ secrets.ODDS_PUSH_SUBSCRIBE_JSON }}
          LIVE_HAMMER_EDGE_THRESHOLD: ${{ vars.LIVE_HAMMER_EDGE_THRESHOLD }}
          WATCHLIST_EDGE_THRESHOLD: ${{ vars.WATCHLIST_EDGE_THRESHOLD }}
          LIVE_STALE_MIN_SCORE: ${{ vars.LIVE_STALE_MIN_SCORE }}
          LIVE_SHARP_BOOKS: ${{ vars.LIVE_SHARP_BOOKS }}
          LIVE_SOFT_BOOKS: ${{ vars.LIVE_SOFT_BOOKS }}
        run: |
          args=""
          if [ "${{ inputs.check_live }}" = "true" ]; then
            args="$args --live"
          fi
          if [ "${{ inputs.show_optional }}" = "true" ]; then
            args="$args --optional"
          fi
          python env_healthcheck.py $args
