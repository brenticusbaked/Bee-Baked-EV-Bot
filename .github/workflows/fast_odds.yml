name: Fast Odds Refresh

on:
  schedule:
    # Aggressively refresh the master cache every 30 minutes during the
    # active betting window. The 40-credit cap keeps runs lightweight.
    - cron: '*/30 12-23 * * *'
  workflow_dispatch:

concurrency:
  group: fast-odds
  cancel-in-progress: true

jobs:
  fast-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fast Odds Refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_SHARP_REGION: "eu"
          ODDS_API_SOFT_REGION: "us"
          ODDS_API_SHARP_BOOKS: "pinnacle"
          ODDS_API_SOFT_BOOKS: "fanduel,draftkings,betmgm,bet365,caesars,bovada"
          ODDS_MAX_CREDITS_PER_RUN: "40"
          ODDS_MAX_EVENTS_PER_ENRICH: "20"
          ENABLE_PLAYER_PROPS_PULL: "false"
          ENABLE_ODDS_SECONDARY_PULL: "true"
          ENABLE_ODDS_TERTIARY_PULL: "true"
          ENABLE_MLB_F5_PULL: "true"
          ENABLE_MLB_NRFI_PULL: "true"
        run: |
          python master_odds_fetcher.py
