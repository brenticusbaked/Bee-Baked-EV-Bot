name: Arbitrage Scanner

on:
  schedule:
    # 2×/day, 25 min after the core pipeline refreshes odds cache.
    # Arbs require cross-book price discrepancies on US books only;
    # Pinnacle is not bettable so high-frequency scanning adds cost with no value.
    - cron: '25 14,20 * * *'
  workflow_dispatch:

concurrency:
  group: arbitrage-scan
  cancel-in-progress: true

jobs:
  arbitrage-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Arbitrage Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_ARBITRAGE_WEBHOOK_URL: ${{ secrets.DISCORD_ARBITRAGE_WEBHOOK_URL }}
          ARBITRAGE_MIN_PROFIT: "0.005"
          ARBITRAGE_MAX_ALERTS: "10"
        run: python arbitrage_scanner.py
