name: Arbitrage Scanner

on:
  schedule:
    # Cache-only scan across daytime and evening windows.
    - cron: '7,22,37,52 14-23,0-3 * * *'
  workflow_dispatch:

jobs:
  arbitrage-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Arbitrage Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_ARBITRAGE_WEBHOOK_URL: ${{ secrets.DISCORD_ARBITRAGE_WEBHOOK_URL }}
          ARBITRAGE_MIN_PROFIT: "0.005"
          ARBITRAGE_MAX_ALERTS: "10"
        run: python arbitrage_scanner.py
