name: Weekend Soccer Scanner

on:
  schedule:
    # 6:00 AM CST (12:00 UTC) - Saturdays and Sundays only
    - cron: '0 12 * * 6,0'
    # 8:00 AM CST (14:00 UTC) - Saturdays and Sundays only
    - cron: '0 14 * * 6,0'
  workflow_dispatch: 

permissions:
  contents: write  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Soccer Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot-soccer.py

      - name: Commit and Push Log
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f bets_log.csv ]; then
            git add bets_log.csv
            git commit -m "Auto-log new EPL +EV bets" || echo "No changes to commit"
            git pull --rebase origin main
            git push
          else
            echo "No bets logged on this run. Skipping commit."
          fi