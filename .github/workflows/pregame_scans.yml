name: Pregame Window Scans

on:
  schedule:
    # Day/early-evening pregame watcher. Uses the latest cached odds by default.
    - cron: '*/15 16-22 * * *'
  workflow_dispatch:

jobs:
  pregame-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pregame Window Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BET_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_BET_ALERTS_WEBHOOK_URL }}
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          PREGAME_SCAN_WINDOWS: "90,45,15"
          PREGAME_SCAN_TOLERANCE_MINUTES: "7"
          PREGAME_STATUS_NOTIFY: "true"
          PREGAME_REFRESH_ODDS: "false"
        run: python pregame_scan.py
