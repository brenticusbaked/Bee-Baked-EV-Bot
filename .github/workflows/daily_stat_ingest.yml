name: Daily Stat Ingest

on:
  schedule:
    # 09:00 UTC = 4 AM Central (yesterday's final box scores).
    # 23:00 UTC = 6 PM Eastern (today's mostly-final day games).
    # Populates *_player_logs that feed the "Last 10" hit-rate context.
    - cron: '0 9,23 * * *'
  workflow_dispatch:

concurrency:
  group: daily-stat-ingest
  cancel-in-progress: true

jobs:
  ingest-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Stat Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENABLE_MLB_STAT_INGEST: "true"
          ENABLE_NBA_STAT_INGEST: "true"
          ENABLE_WNBA_STAT_INGEST: "true"
          ENABLE_NFL_STAT_INGEST: "true"
          # soccerdata scrapes FBref, which serves a CAPTCHA to GitHub Actions
          # IPs (can't be solved from CI). Off by default; flip the repo variable
          # to "true" only if running from an unblocked/residential runner.
          ENABLE_SOCCER_STAT_INGEST: ${{ vars.ENABLE_SOCCER_STAT_INGEST || 'false' }}
          ENABLE_TENNIS_STAT_INGEST: "true"
          # Fall back to the code default when the repo variable is unset, so an
          # empty value doesn't wipe the soccer league list.
          SOCCER_STAT_LEAGUES: ${{ vars.SOCCER_STAT_LEAGUES || 'ENG-Premier League,USA-Major League Soccer' }}
          # Proxy pool for the selective statsapi.mlb.com fallback only. NBA/WNBA
          # now use ESPN's public API (no proxy needed); stats.nba.com is dropped.
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # This provider uses a fixed zone/gateway username (no rotating
          # -session- suffix), which otherwise 407s. Send the username verbatim.
          PROXY_STICKY_SESSIONS: "false"
        run: |
          python daily_stat_ingest.py
