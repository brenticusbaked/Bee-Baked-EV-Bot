name: Unified EV Scanner

on:
  schedule:
    # Runs twice a day at 14:00 UTC (10 AM EST) and 22:00 UTC (6 PM EST)
    - cron: '0 14,22 * * *'
  workflow_dispatch: # Allows manual triggering via GitHub

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run Scanners (API Limit Protected)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "Scanning daily sports..."
          python unified_bot.py --sport nba
          python unified_bot.py --sport ncaab
          python unified_bot.py --sport nhl
          python unified_bot.py --sport soccer
          python unified_bot.py --sport esports
          python unified_bot.py --sport tennis
          
          # Uncomment the line below when MLB season officially starts!
          # python unified_bot.py --sport mlb

          # Check if today is Saturday (Day 6 of the week)
          if [ "$(date +'%u')" -eq 6 ]; then
            echo "Today is Saturday! Scanning MMA..."
            python unified_bot.py --sport mma
          else
            echo "Not Saturday. Skipping MMA to save API calls."
          fi

      - name: Commit and Push CSV Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bets_log.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update bets_log.csv with new +EV plays" && git push)