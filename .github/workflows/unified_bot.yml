name: Unified EV Scanner

on:
  schedule:
    # Runs at 14:00 UTC (10:00 AM EST) and 22:00 UTC (6:00 PM EST)
    - cron: '0 14,22 * * *'
  workflow_dispatch:

# This permission block is critical. It allows the bot to save the bets_log.csv
permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run Unified Scanner
        env:
          # Pulls your secure keys from GitHub Repository Secrets
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python unified_bot.py --sport all

      - name: Commit and Push CSV Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bets_log.csv
          # This checks if the CSV actually changed. If it did, it commits and pushes it back to your repo.
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update bets_log.csv with new +EV plays" && git push)